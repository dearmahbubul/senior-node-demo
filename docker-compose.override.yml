# Docker Compose development overrides (automatically applied by `docker compose up`)
# For local development with live code reloading
services:
  migration:
    build:
      context: .
      dockerfile: Dockerfile
      target: development

  app:
    build:
      context: .
      dockerfile: Dockerfile
      target: development
    command: ["npm", "run", "dev"]
    volumes:
      - .:/app
      - /app/node_modules
      - /app/src/generated
      - app_uploads:/app/uploads
    environment:
      NODE_ENV: development
      LOG_LEVEL: debug

  worker:
    build:
      context: .
      dockerfile: Dockerfile
      target: development
    command: ["npm", "run", "worker"]
    volumes:
      - .:/app
      - /app/node_modules
      - /app/src/generated
    environment:
      NODE_ENV: development
      LOG_LEVEL: debug
