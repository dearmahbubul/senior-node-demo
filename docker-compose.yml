services:
  # Ephemeral database migration service to run Prisma migrations on startup
  migration:
    build:
      context: .
      dockerfile: Dockerfile
    command: ["npx", "prisma", "migrate", "deploy"]
    environment:
      DATABASE_URL: postgresql://postgres:postgres@db:5432/senior_demo
    depends_on:
      db:
        condition: service_healthy
    restart: "no"

  # Main Node.js API application
  app:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - '3010:3000'  # host 3010 -> container 3000 (host side kept clear of Next.js dev servers)
    environment:
      NODE_ENV: production
      PORT: 3000
      DATABASE_URL: postgresql://postgres:postgres@db:5432/senior_demo
      REDIS_URL: redis://redis:6379
      RABBITMQ_URL: amqp://admin:admin@rabbitmq:5672
      JWT_SECRET: ${JWT_SECRET:-change-me-min-16-chars-secret}
      LOG_LEVEL: info
      STORAGE_DRIVER: ${STORAGE_DRIVER:-local}
      UPLOAD_DIR: uploads
      S3_ENDPOINT: ${S3_ENDPOINT:-http://minio:9000}
      S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID:-minioadmin}
      S3_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY:-minioadmin}
      S3_BUCKET: ${S3_BUCKET:-uploads}
      S3_REGION: ${S3_REGION:-us-east-1}
      SMTP_HOST: ${SMTP_HOST:-mailpit}
      SMTP_PORT: ${SMTP_PORT:-1025}
    volumes:
      - app_uploads:/app/uploads
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      migration:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD-SHELL", "node -e \"fetch('http://localhost:3000/health').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))\""]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s
    restart: unless-stopped

  # Background worker for consuming RabbitMQ notification queues
  worker:
    build:
      context: .
      dockerfile: Dockerfile
    command: ["node", "dist/workers/notification.worker.js"]
    environment:
      NODE_ENV: production
      DATABASE_URL: postgresql://postgres:postgres@db:5432/senior_demo
      REDIS_URL: redis://redis:6379
      RABBITMQ_URL: amqp://admin:admin@rabbitmq:5672
      LOG_LEVEL: info
      SMTP_HOST: ${SMTP_HOST:-mailpit}
      SMTP_PORT: ${SMTP_PORT:-1025}
    depends_on:
      db:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      migration:
        condition: service_completed_successfully
    restart: unless-stopped

  # Redis in-memory cache and key-value store (caching, session management, and rate limiting)
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: [ "CMD", "redis-cli", "ping" ]
      interval: 5s
      timeout: 3s
      retries: 5

  # RabbitMQ message broker for asynchronous messaging, task queues, and event handling
  rabbitmq:
    image: rabbitmq:4-management-alpine
    ports:
      - "5672:5672"   # AMQP protocol port — your app connects here
      - "15672:15672" # management UI — browser dashboard
    environment:
      RABBITMQ_DEFAULT_USER: admin
      RABBITMQ_DEFAULT_PASS: admin
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    healthcheck:
      test: [ "CMD", "rabbitmq-diagnostics", "ping" ]
      interval: 5s
      timeout: 5s
      retries: 5

  # PostgreSQL relational database for primary application data persistence
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: senior_demo
    ports:
      - '5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: [ 'CMD-SHELL', 'pg_isready -U postgres' ]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  # Dozzle: Lightweight real-time web-based log viewer for Docker containers (UI: http://localhost:9999)
  dozzle:
    image: amir20/dozzle:latest
    ports:
      - "9999:8080"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro

  # Redis Commander: Web UI management tool for browsing and editing Redis keys (UI: http://localhost:8081)
  redis-commander:
    image: rediscommander/redis-commander:latest
    environment:
      REDIS_HOSTS: local:redis:6379
    ports:
      - "8081:8081"

  # pgAdmin: Web-based PostgreSQL administration and data viewer (UI: http://localhost:5050)
  pgadmin:
    image: dpage/pgadmin4:latest
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@admin.com
      PGADMIN_DEFAULT_PASSWORD: admin
    ports:
      - "5050:80"
    volumes:
      - pgadmin_data:/var/lib/pgadmin
      - ./servers.json:/pgadmin4/servers.json:ro
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  # MinIO: S3-compatible object storage server for testing file uploads with STORAGE_DRIVER=s3
  # start with: docker compose --profile s3 up -d minio (UI: http://localhost:9001)
  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    volumes:
      - minio_data:/data
    profiles:
      - s3

  # Mailpit: Fake SMTP server with web inbox for capturing and inspecting outgoing emails
  # start with: docker compose --profile mail up -d mailpit (UI: http://localhost:8030)
  mailpit:
    image: axllent/mailpit:latest
    ports:
      - "1030:1025"   # SMTP (host 1030; 1025 may clash with other local projects)
      - "8030:8025"   # Web inbox
    profiles:
      - mail

volumes:
  postgres_data:
  redis_data:
  rabbitmq_data:
  minio_data:
  app_uploads:
  pgadmin_data: